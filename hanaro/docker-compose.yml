services:
  mysql:
    image: mysql:8.0
    ports:
      - "3308:3306"
    container_name: hanaro-db
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: hanarodb
      MYSQL_USER: hanaro
      MYSQL_PASSWORD: 12345678
      TZ: Asia/Seoul
    volumes:
      - hanaro-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb_ft_min_token_size=2
      - --log_bin_trust_function_creators=1
    restart: unless-stopped

volumes:
  hanaro-mysql-data:
    driver: local
